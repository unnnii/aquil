<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entries, Heartian Hustle 3.0</title>
<meta name="description" content="Organiser console for Heartian Hustle 3.0 entries.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f7f8fa">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d1220'/%3E%3Ctext x='16' y='24' font-family='Arial Narrow,Helvetica,Arial' font-size='20' font-weight='700' fill='%23f7f8fa' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500&family=JetBrains+Mono:wght@500&family=Saira+Condensed:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261119c">
<script>document.documentElement.className += ' js';</script>
</head>

<body>
<a class="skip" href="#main">Skip to content</a>

<header class="mast">
  <div class="wrap mast-inner">
    <a class="wordmark" href="index.html">Heartian Hustle</a>
    <div class="mast-tools">
    </div>
    <nav class="nav" id="site-nav" data-nav>
      <a href="index.html">Site</a>
      <a href="events.html">Competitions</a>
      <a href="schedule.html">Programme</a>
    </nav>
  </div>
</header>

<main id="main">

  <section class="hero">
    <div class="wrap">
      <h1>Entries</h1>
      <p class="lede">Sign in to read the registration sheet, filter it by sport, and download a CSV for seeding draws.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">

      <!-- Sign in ------------------------------------------------------- -->
      <div class="admin-auth" data-admin-login>
        <form data-login-form class="stack" novalidate>
          <div class="field">
            <label for="admin-username">Username</label>
            <input id="admin-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          </div>
          <div class="field">
            <label for="admin-password">Password</label>
            <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <div class="notice" data-login-error hidden role="alert"></div>
          <div class="field">
            <button class="btn btn-volt" type="submit">Sign in</button>
          </div>
        </form>
      </div>

      <!-- Console ------------------------------------------------------ -->
      <div data-admin-app hidden>
        <div class="notice" data-admin-error hidden role="alert"></div>

        <dl class="admin-stats" data-admin-stats></dl>

        <div class="admin-filters mt-lg">
          <div class="field">
            <label for="admin-q">Search</label>
            <input id="admin-q" type="search" placeholder="Name, roll number, phone" data-admin-search>
          </div>
          <div class="field">
            <label for="admin-event">Sport</label>
            <select id="admin-event" data-admin-event>
              <option value="">All sports</option>
            </select>
          </div>
          <div class="field">
            <label for="admin-kind">Entries</label>
            <select id="admin-kind" data-admin-kind>
              <option value="batch">Batch</option>
              <option value="team">Team</option>
            </select>
          </div>
          <div class="field admin-filter-reset">
            <button class="btn btn-line" type="button" data-admin-reset>Reset filters</button>
          </div>
        </div>

        <div class="actions mt-lg">
          <button class="btn btn-line" type="button" data-admin-refresh>Refresh</button>
          <button class="btn btn-line" type="button" data-admin-csv>Download CSV</button>
          <button class="btn btn-line" type="button" data-admin-logout>Sign out</button>
        </div>

        <p class="hint" data-admin-count aria-live="polite"></p>

        <div class="sheet-wrap">
          <table class="admin-table" data-admin-table></table>
        </div>
      </div>

    </div>
  </section>

</main>

<footer class="foot">
  <div class="wrap">
    <div class="colophon">
      <span>&copy; <span data-year>2026</span> Heartian Hustle 3.0</span>
      <span>made with &lt;3 by unni for SHC</span>
    </div>
  </div>
</footer>

<script src="js/config.js?v=20261119c" defer></script>
<script src="js/site.js?v=20261119c" defer></script>
<script src="js/admin.js?v=20261119c" defer></script>
</body>
</html>
